name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Ler configuração SSH
        env:
          SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
        run: |
          test -n "$SSH_CONFIG"
          echo "SSH_HOST=$(jq -er '.host' <<< "$SSH_CONFIG")" >> "$GITHUB_ENV"
          echo "SSH_USER=$(jq -er '.username' <<< "$SSH_CONFIG")" >> "$GITHUB_ENV"
          echo "SSH_PASS=$(jq -er '.password' <<< "$SSH_CONFIG")" >> "$GITHUB_ENV"
          echo "SSH_PORT=$(jq -er '.port' <<< "$SSH_CONFIG")" >> "$GITHUB_ENV"

      - name: Publicar site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASS }}
          port: ${{ env.SSH_PORT }}
          source: dist/
          target: /www/wwwroot/Portfolio/dist
          strip_components: 1
